{{ define "main" }}
<section class="page-hero">
  <div class="container">
    <div class="page-hero-card">
      <h1>{{ .Title }}</h1>
      {{ with .Params.description }}
      <p>{{ . }}</p>
      {{ end }}
    </div>
  </div>
</section>
<section class="section">
  <div class="container content">{{ .Content }}</div>
</section>
{{ end }}
