{{ define "main" }}
<section class="page-hero">
  <div class="container">
    <div class="page-hero-card">
      <h1>{{ .Title }}</h1>
      {{ with .Params.description }}
      <p>{{ . }}</p>
      {{ end }}
    </div>
  </div>
</section>
<section class="section">
  <div class="container">
    {{ .Content }}
    <div class="row g-4">
      {{ range .Pages }}
      <div class="col-12 col-md-6 col-lg-4">
        <article class="service-card">
          <h2><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
          {{ .Summary }}
        </article>
      </div>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
